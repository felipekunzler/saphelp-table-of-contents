<!-- Favorite Products Section -->
<div *ngIf="favoriteProducts.length > 0" class="favorite-section">
    <div>Favorite Products</div>
    <div class="favorite-products">
        <div *ngFor="let favorite of favoriteProducts" class="favorite-item" (click)="selectFavoriteProduct(favorite)">
            <span class="favorite-star">★</span>
            <span>{{ favorite.name }}</span>
        </div>
    </div>
</div>

<form [formGroup]="tocForm" (ngSubmit)="onSubmit(tocForm.value)" class="toc-form">
    <div class="row">
        <div class="col-12 col-md-7 product-col">
            <label>Product</label>
            <div class="select-wrapper">
                <ng-select [items]="products | async" bindLabel="name" bindValue="code" formControlName="product"
                    (change)="onProductChanged(false, false)">
                </ng-select>
                <div *ngIf="(products | async) as productList" class="star-overlay">
                </div>
            </div>
        </div>
        <div class="col-12 col-md-5">
            <div class="row align-items-end">
                <div class="col version-col">
                    <label>Version</label>
                    <ng-select [items]="versions | async" bindLabel="value" bindValue="key" formControlName="version">
                    </ng-select>
                </div>
                <div class="col-auto submit-div">
                    <button class="button" type="submit" [disabled]="loading || loadingProducts">Load</button>
                </div>
            </div>
        </div>
    </div>
</form>

<div class="status-block">
    <div *ngIf="loadingProducts">
        Loading products...
    </div>
    <div *ngIf="!loadingProducts">
        Links loaded: {{ pagesLoaded }}
    </div>
</div>

<div class="loading-block">
    <div *ngIf="loading">
        <span>Loading Table of Contents...</span>
    </div>

    <div *ngIf="!loading" class="expand-collpase">
        <button (click)="onExpandAllPagesClick()">Expand all</button>
        <button (click)="onExpandOneLevelPagesClick()">Expand one level</button>
        <button (click)="onCollapseAllPagesClick()">Collapse all</button>
        <button *ngIf="tocForm.value.product" type="button"
            [ngClass]="{ 'favorite-toggle-button--active': isFavorite(tocForm.value.product) }"
            (click)="toggleFavoriteByCode(tocForm.value.product)" title="Toggle favorite">
            {{ isFavorite(tocForm.value.product) ? 'Remove from favorites' : 'Add to favorites' }}
        </button>
    </div>
</div>
<div class="toc-container">
    <div *ngFor="let link of links">
        <ul>
            <app-toc [link]="link"></app-toc>
        </ul>
    </div>
</div>
